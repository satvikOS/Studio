name: Build ArchDisc Studio Desktop App

# Auto-build + publish on EVERY push to `archdisc`. Each push produces a
# published GitHub Release carrying the 3 platform installers PLUS the
# electron-updater channel manifests (latest.yml / latest-mac.yml /
# latest-linux.yml). Installed apps poll those manifests and auto-update.
#
# Build matrix — Electron apps must be built ON their target OS:
#   - windows-latest -> NSIS .exe installer        (latest.yml)
#   - macos-latest   -> .dmg installer + .zip      (latest-mac.yml)
#                       (zip is REQUIRED for macOS auto-update)
#   - ubuntu-latest  -> .AppImage                  (latest-linux.yml)
#
# Versioning: package.json version is stamped to 1.0.<run_number + 346>
# before electron-builder runs. The +346 offset skips past Mech's last
# tag (v1.0.346) so Studio's release numbering continues monotonically
# from where Mech's history left off — the two repos share the early
# commit lineage but produce independent installers / update channels.
# electron-updater compares versions to decide whether to upgrade.
#
# Code signing: builds are UNSIGNED. Windows shows SmartScreen warnings;
# macOS Gatekeeper blocks first launch (right-click > Open to bypass) and
# auto-update is unreliable without notarization. To sign, add secrets:
#   Windows: CSC_LINK, CSC_KEY_PASSWORD  (Authenticode cert)
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
#            APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# electron-builder picks these up automatically from the environment.

on:
  push:
    branches: [archdisc]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Per-SHA group so every commit gets its own queue slot and a real
  # release. No cancellation — releasing on every commit is intentional.
  group: build-app-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: electron 42 (+ node-abi / @electron/get / @electron/rebuild)
          # require >=22.12.0. Node 20 triggered a stream of EBADENGINE warnings.
          node-version: '22'

      # Cache electron / electron-builder binaries (NSIS, app-builder,
      # etc.) — these download from github.com and occasionally 502.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      # Per-commit version: 1.0.<run_number + 346>. Offset skips Mech's
      # tag history so Studio's release numbering continues monotonically.
      # Always increases, so electron-updater always sees field installs
      # as outdated. NOTE: GitHub Actions expressions don't support `+`
      # arithmetic, so the addition happens in bash, not in `${{ ... }}`.
      - name: Stamp per-commit version
        shell: bash
        run: |
          VERSION="1.0.$(( ${{ github.run_number }} + 346 ))"
          echo "Stamping version $VERSION"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='$VERSION';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n');"
          node -e "console.log('package.json version is now', require('./package.json').version)"

      # --ignore-scripts is REQUIRED here: the root package.json defines an
      # `install` lifecycle script (`npm install --prefix backend && ...`).
      # `backend/` is a separate server component — it is NOT bundled into the
      # desktop installer (electron-builder.yml `files` whitelists only
      # electron/** + frontend/dist/**, and explicitly excludes backend/**).
      # Letting the hook run dragged in the huge @aws-sdk/* + @langchain/*
      # tree, which crashed Windows npm with EPERM during cleanup. The desktop
      # release build only needs root (electron/electron-builder/electron-updater)
      # + frontend deps.
      - name: Install root dependencies (electron, electron-builder, electron-updater)
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      # Guard the build-break class that took CI red on #841–#848: a source
      # file imported a package installed locally but never added to the
      # committed package.json (the lock is gitignored, so CI resolves fresh
      # and Rollup fails). Fails fast with the exact package + file.
      - name: Verify all imports are declared
        run: node test/deps-declared.test.js
        working-directory: frontend

      - name: Build frontend (Vite)
        run: npx vite build
        working-directory: frontend

      - name: Build + publish (${{ matrix.platform }})
        shell: bash
        env:
          # electron-builder publishes to GitHub Releases with this token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "electron-builder attempt $i for ${{ matrix.platform }}"
            npx electron-builder --${{ matrix.platform }} --publish always && break
            if [ "$i" -eq 3 ]; then
              echo "electron-builder failed after 3 attempts"
              exit 1
            fi
            sleep $((i * 20))
          done

      # Keep a copy of the installers on the run too (handy if a release
      # asset upload is ever flaky).
      - name: Upload installers as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArchDisc-${{ matrix.platform }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.yml
          retention-days: 14
          if-no-files-found: ignore
