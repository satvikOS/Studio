<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  .topL{ position:absolute; left:56px; top:48px; z-index:6; }
  .topR{ position:absolute; right:56px; top:48px; z-index:6; text-align:right; }
  .lockup{ font-size:17px; color:var(--ink); }
  .lockup .sub{ display:block; font-family:var(--mono); font-weight:400; font-size:9px; letter-spacing:.16em; color:var(--faint); margin-top:4px; }
  .bigh{ position:absolute; left:60px; top:150px; z-index:6; font-size:74px; }
  .bigh .g{ color:var(--ink-mid); }
  /* three GIANT product marks with what-they-are */
  .row{ position:absolute; left:60px; right:60px; top:368px; z-index:6; display:flex; align-items:flex-end; gap:0; }
  .prod{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding:0 10px; }
  .prod .ic{ height:128px; display:flex; align-items:flex-end; }
  .prod .nm{ font-family:var(--disp); font-weight:700; font-size:30px; color:var(--ink); letter-spacing:-.02em; }
  .prod .what{ font-size:15px; color:var(--ink-mid); }
  .prod .archie-mark{ font-size:50px; line-height:.8; }
  .team{ position:absolute; left:60px; bottom:64px; z-index:6; font-size:15px; color:var(--ink-soft); }
  .team b{ color:var(--ink); font-weight:600; }
  .team .u{ color:var(--clay); }
</style></head>
<body>
<div class="sheet" data-sheet="01" data-foot="ARCHDISC">
  <div class="bgmodel right art" style="opacity:.22"><img src="../assets/abstract/abs2.png"></div>
  <div class="topL"><span class="wordmark">ARCHDISC</span></div>
  <div class="topR"><span class="lockup">ClawComp <span class="x">×</span> Link&nbsp;Ventures<span class="sub">host and venue</span></span></div>

  <div class="bigh">Describe it.<br><span class="g">Archie builds it.</span></div>

  <div class="row">
    <div class="prod">
      <div class="ic"><img src="../assets/logos/studio.svg" width="118" height="118"></div>
      <div class="nm">Studio</div><div class="what">3D creation</div>
    </div>
    <div class="prod">
      <div class="ic"><img src="../assets/logos/forge.svg" width="120" height="128"></div>
      <div class="nm">Forge</div><div class="what">Mechanical CAD</div>
    </div>
    <div class="prod">
      <div class="ic"><span class="archie-mark">Archie</span></div>
      <div class="nm" style="visibility:hidden">Archie</div><div class="what">The AI that builds both</div>
    </div>
  </div>

  <div class="team"><b>Satvik Adyanthaya</b> and <b>Jeff Munkondaya</b> <span class="u">University of Rochester</span></div>
</div>
<script src="../assets/frame.js"></script>
</body></html>
