<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  .eyebrow-mono{ position:absolute; left:60px; top:50px; z-index:6; font-family:var(--mono); font-size:12px; letter-spacing:.24em; color:var(--clay); }
  .lockup{ position:absolute; right:60px; top:48px; z-index:6; color:var(--ink); font-size:14px; }
  .htext{ position:absolute; left:60px; top:96px; z-index:6; }
  .bigh{ font-size:46px; }
  .bigh .g{ color:var(--ink-mid); }
  .subline{ font-size:17px; color:var(--ink-soft); margin-top:10px; }
  .vframe{ position:absolute; left:260px; top:190px; width:760px; height:428px; z-index:6;
    border:1.4px solid var(--line-strong); background:#16110d; overflow:hidden; box-shadow:0 18px 50px rgba(58,44,31,.22); }
  .play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:80px; height:80px; border-radius:50%;
    border:2px solid #f1e8d4; display:flex; align-items:center; justify-content:center; background:rgba(30,22,16,.4); }
  .play::after{ content:""; border-left:24px solid #f1e8d4; border-top:14px solid transparent; border-bottom:14px solid transparent; margin-left:6px; }
  .vcap{ position:absolute; left:0; bottom:0; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:#f1e8d4; background:rgba(15,11,8,.66); padding:8px 13px; }
  .vtag{ position:absolute; right:13px; top:12px; font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:rgba(241,232,212,.6); }
</style></head>
<body>
<div class="sheet" data-sheet="04" data-foot="THE DEMO">
  <div class="bgmodel right art tall" style="opacity:.18"><img src="../assets/abstract/abs5.png"></div>
  <div class="vframe">
    <div class="play"></div>
    <div class="vcap">STUDIO. ARCHIE RIGS AND ANIMATES, LIVE</div>
    <div class="vtag">▶ CLICK TO PLAY</div>
  </div>
  <div class="eyebrow-mono">THE DEMO</div>
  <div class="lockup">ClawComp <span class="x">×</span> Link&nbsp;Ventures</div>
  <div class="htext">
    <div class="bigh">Don’t take our word. <span class="g">Watch it build.</span></div>
    <div class="subline">One sentence in. Archie plans, builds, and brings it to life, right on your machine.</div>
  </div>
</div>
<script src="../assets/frame.js"></script>
</body></html>
