<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  .eyebrow-mono{ position:absolute; left:60px; top:50px; z-index:6; font-family:var(--mono); font-size:12px; letter-spacing:.24em; color:var(--clay); }
  .lockup{ position:absolute; right:60px; top:48px; z-index:6; color:var(--ink); font-size:14px; }
  .htext{ position:absolute; left:60px; top:96px; z-index:6; }
  .bigh{ font-size:44px; }
  .bigh .g{ color:var(--ink-mid); }
  .subline{ font-size:16px; color:var(--ink-soft); margin-top:9px; }
  .flab{ position:absolute; z-index:6; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .flab .dot{ width:6px; height:6px; background:var(--clay); border-radius:50%; }
  .frame{ position:absolute; z-index:6; border:1.4px solid var(--line-strong); overflow:hidden; box-shadow:0 16px 44px rgba(58,44,31,.2); background:#14110d; }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .f-forge{ left:56px; top:244px; width:572px; height:280px; }
  .f-studio{ left:652px; top:310px; width:572px; height:214px; }
  .play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:70px; height:70px; border-radius:50%;
    border:2px solid #f1e8d4; display:flex; align-items:center; justify-content:center; background:rgba(20,15,10,.4); }
  .play::after{ content:""; border-left:21px solid #f1e8d4; border-top:12px solid transparent; border-bottom:12px solid transparent; margin-left:6px; }
  .ftag{ position:absolute; left:0; bottom:0; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:#f1e8d4; background:rgba(10,8,5,.66); padding:6px 11px; }
</style></head>
<body>
<div class="sheet" data-sheet="04" data-foot="THE DEMO">
  <div class="bgmodel right art tall" style="opacity:.12"><img src="../assets/abstract/abs5.png"></div>
  <div class="eyebrow-mono">THE DEMO</div>
  <div class="lockup">ClawComp <span class="x">×</span> Link&nbsp;Ventures</div>
  <div class="htext">
    <div class="bigh">Don’t take our word. <span class="g">Watch it build.</span></div>
    <div class="subline">A real engine, and a real world, built by Archie. Right on the machine.</div>
  </div>

  <div class="flab" style="left:56px;top:218px"><span class="dot"></span>FORGE · LEAP-1A ENGINE · FULL PROCESS</div>
  <div class="flab" style="left:652px;top:284px"><span class="dot"></span>STUDIO · FOREST WALK · REAL TIME</div>

  <div class="frame f-forge">
    <img src="../assets/shots/forge-leap1a-poster.png">
    <div class="play"></div>
    <div class="ftag">FORGE · CLICK TO PLAY</div>
  </div>
  <div class="frame f-studio">
    <img src="../assets/shots/studio-forest-poster.png">
    <div class="play"></div>
    <div class="ftag">STUDIO · CLICK TO PLAY</div>
  </div>
</div>
<script src="../assets/frame.js"></script>
</body></html>
