<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  .eyebrow-mono{ position:absolute; left:60px; top:50px; z-index:6; font-family:var(--mono); font-size:11px; letter-spacing:.24em; color:var(--amber); }
  .lockup{ position:absolute; right:60px; top:48px; z-index:6; color:var(--on-ink); font-size:14px; }
  .htext{ position:absolute; left:60px; top:96px; z-index:6; }
  .bigh{ font-size:42px; }
  .bigh .g{ color:var(--on-ink-soft); }
  .subline{ font-size:15px; color:var(--on-ink-soft); margin-top:9px; letter-spacing:-.008em; }
  .vframe{ position:absolute; left:260px; top:190px; width:760px; height:428px; z-index:6;
    border:1.4px solid var(--on-ink-line-strong); background:#16110d; overflow:hidden; }
  .play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:76px; height:76px; border-radius:50%;
    border:2px solid var(--on-ink); display:flex; align-items:center; justify-content:center; background:rgba(30,22,16,.45); }
  .play::after{ content:""; border-left:23px solid var(--on-ink); border-top:13px solid transparent; border-bottom:13px solid transparent; margin-left:6px; }
  .vcap{ position:absolute; left:0; bottom:0; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--on-ink); background:rgba(15,11,8,.7); padding:7px 12px; }
  .vtag{ position:absolute; right:12px; top:11px; font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--on-ink-faint); }
</style></head>
<body>
<div class="sheet ink" data-sheet="04" data-foot="DEMO">
  <div class="bgmodel right tall" style="opacity:.2"><img src="../assets/shots/studio-skull.png"></div>
  <div class="vframe">
    <div class="play"></div>
    <div class="vcap">STUDIO · ARCHIE RIGS &amp; ANIMATES — LIVE CAPTURE</div>
    <div class="vtag">▶ CLICK TO PLAY</div>
  </div>
  <div class="eyebrow-mono">DEMO · SEE IT BUILD</div>
  <div class="lockup">ClawComp <span class="x">×</span> Link&nbsp;Ventures</div>
  <div class="htext">
    <div class="bigh">Don’t take our word. <span class="g">Watch it build.</span></div>
    <div class="subline">One prompt → Archie plans, builds, and brings it to life — live, on-device.</div>
  </div>
</div>
<script src="../assets/frame.js"></script>
</body></html>
