<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  .head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .lockup{ color:var(--on-ink); font-size:14px; }
  .htext{ margin-top:14px; }
  .bigh{ font-size:42px; }
  .bigh .g{ color:var(--on-ink-soft); }
  .subline{ font-size:15px; color:var(--on-ink-soft); margin-top:9px; letter-spacing:-.008em; }
  /* video frame — placed at an exact px rect so the embedded movie aligns in the pptx */
  .vframe{ position:absolute; left:260px; top:190px; width:760px; height:428px; z-index:6;
    border:1.4px solid var(--on-ink-line-strong); background:#101317; overflow:hidden; }
  .vframe .grid{ position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(rgba(236,235,231,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(236,235,231,.05) 1px,transparent 1px);
    background-size:34px 34px; }
  .play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:78px; height:78px; border-radius:50%;
    border:2px solid var(--on-ink); display:flex; align-items:center; justify-content:center; background:rgba(20,24,28,.5); }
  .play::after{ content:""; border-left:24px solid var(--on-ink); border-top:14px solid transparent; border-bottom:14px solid transparent; margin-left:6px; }
  .vcap{ position:absolute; left:0; bottom:0; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:#ecebe7; background:rgba(8,10,13,.72); padding:7px 12px; }
  .vtag{ position:absolute; right:12px; top:11px; font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--on-ink-faint); }
  .footnote{ position:absolute; left:50px; bottom:104px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--on-ink-faint); }
</style></head>
<body>
<div class="sheet ink" data-sheet="04" data-rev="A" data-scale="NTS">
  <div class="vframe">
    <div class="grid"></div>
    <div class="play"></div>
    <div class="vcap">STUDIO · ARCHIE RIGS &amp; ANIMATES — LIVE CAPTURE</div>
    <div class="vtag">MOV-01 · ▶ CLICK TO PLAY</div>
  </div>
  <div class="stage">
    <div class="head">
      <span class="u-label" style="color:var(--on-ink-soft)"><span class="eyebrow"><span class="dot"></span>DEMO · SEE IT BUILD</span></span>
      <span class="lockup">ClawComp <span class="x">×</span> Link&nbsp;Ventures</span>
    </div>
    <div class="htext">
      <div class="bigh">Don’t take our word. <span class="g">Watch it build.</span></div>
      <div class="subline">One prompt → Archie plans, builds, and brings it to life — live, on-device.</div>
    </div>
  </div>
</div>
<script src="../assets/frame.js"></script>
</body></html>
