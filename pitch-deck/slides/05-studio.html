<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>
  .eyebrow-mono{ position:absolute; left:60px; top:50px; z-index:6; font-family:var(--mono); font-size:12px; letter-spacing:.24em; color:var(--clay); }
  .htext{ position:absolute; left:60px; top:92px; z-index:6; }
  .bigh{ font-size:44px; }
  .bigh .g{ color:var(--ink-mid); }
  .sub{ font-size:16px; color:var(--ink-soft); margin-top:8px; }
  .sub b{ color:var(--ink); font-weight:600; }
  .grid{ position:absolute; left:60px; right:60px; top:208px; z-index:6;
    display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }
  .room{ position:relative; aspect-ratio:16/9; overflow:hidden; border:1px solid var(--line-strong);
    box-shadow:0 8px 22px rgba(58,44,31,.12); background:#1a1410; }
  .room img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rlabel{ position:absolute; left:0; bottom:0; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:#f1e8d4; background:rgba(10,8,5,.6); padding:5px 9px; }
</style></head>
<body>
<div class="sheet" data-sheet="05" data-foot="STUDIO">
  <div class="bgmodel right art tall" style="opacity:.1"><img src="../assets/abstract/abs3.png"></div>
  <div class="eyebrow-mono">STUDIO · REAL SCENES</div>
  <div class="htext">
    <div class="bigh">A sentence becomes <span class="g">a whole room.</span></div>
    <div class="sub">Every one of these started as one line. <b>Archie laid it out, placed the furniture, and lit the scene.</b></div>
  </div>
  <div class="grid">
    <div class="room"><img src="../assets/shots/rooms/bedroom.png"><span class="rlabel">Bedroom</span></div>
    <div class="room"><img src="../assets/shots/rooms/kitchen.png"><span class="rlabel">Kitchen</span></div>
    <div class="room"><img src="../assets/shots/rooms/living-room.png"><span class="rlabel">Living room</span></div>
    <div class="room"><img src="../assets/shots/rooms/cafe.png"><span class="rlabel">Cafe</span></div>
    <div class="room"><img src="../assets/shots/rooms/dining-room.png"><span class="rlabel">Dining room</span></div>
    <div class="room"><img src="../assets/shots/rooms/home-office.png"><span class="rlabel">Home office</span></div>
  </div>
</div>
<script src="../assets/frame.js"></script>
</body></html>
