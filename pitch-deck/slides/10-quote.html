<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/deck.css">
<style>

  .logos{ position:absolute; right:60px; bottom:78px; z-index:6; display:flex; align-items:center; gap:24px; }

  <div class="bgmodel right art wide" style="opacity:.2"><img src="../assets/abstract/abs1.png"></div>

    <img src="../assets/logos/studio.svg" width="36" height="36">

</div>
