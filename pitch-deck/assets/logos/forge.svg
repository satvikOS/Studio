<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 132" width="124" height="132">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5f55"/>
      <stop offset="46%" stop-color="#352c26"/>
      <stop offset="100%" stop-color="#120d0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#fff3d6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbe9c0"/>
    </linearGradient>
  </defs>
  <!-- bright white glow behind the spark, top-centre -->
  <circle cx="66" cy="24" r="24" fill="url(#glow)"/>
  <!-- sharp, thin, asymmetrical white spark, top-centre -->
  <path d="M66 2 L68.6 25 L66 45 L63.6 25 Z" fill="url(#spark)"/>
  <path d="M44 22 L64 26 L88 20.5 L64 30 Z" fill="url(#spark)" opacity="0.96"/>
  <circle cx="66" cy="25.5" r="2.4" fill="#ffffff"/>
  <!-- BULKIER, heavier anvil -->
  <path d="M8 60 L42 50 L42 46 L108 46 L108 70 L74 70 L74 82
           C90 82 92 88 96 102 L102 116 L22 116 L28 102
           C32 88 34 82 50 82 L50 70 L34 70 Z"
        fill="url(#steel)" stroke="#080605" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- top-face + horn highlights -->
  <path d="M44 48.5 L106 48.5" stroke="#7c6f63" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M12 58 L40 49" stroke="#7c6f63" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
</svg>
