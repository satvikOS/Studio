<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 124" width="120" height="124">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c5149"/>
      <stop offset="48%" stop-color="#322a25"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7ad"/>
      <stop offset="42%" stop-color="#e7a64a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e7a64a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1cc"/>
      <stop offset="100%" stop-color="#e8a948"/>
    </linearGradient>
  </defs>
  <!-- glow behind the star, top-centre -->
  <circle cx="60" cy="22" r="21" fill="url(#glow)"/>
  <!-- sharp, thin, ASYMMETRICAL 4-point star, top-centre above the anvil -->
  <path d="M60 2 L62.4 23 L60 41 L57.9 23 Z" fill="url(#star)"/>
  <path d="M40 21 L58.5 24 L80 19.5 L58.5 27 Z" fill="url(#star)" opacity="0.95"/>
  <circle cx="60" cy="23" r="2.1" fill="#fff6e0"/>
  <!-- STRONGER anvil: bolder, wider top + horn, defined waist + flared feet -->
  <path d="M10 72 L44 63 L44 56 L101 56 L101 73 L70 73 L70 85
           C85 85 87 90 89 100 L97 113 L23 113 L33 100
           C35 90 37 85 52 85 L52 73 L27 73 Z"
        fill="url(#steel)" stroke="#0a0705" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- top-face + horn highlights -->
  <path d="M46 58.5 L99 58.5" stroke="#6e6056" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>
  <path d="M14 70 L42 62" stroke="#6e6056" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
