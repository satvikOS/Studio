  <!-- crisp muted S over the smush -->
  <path d="M71 29 C71 16 30 16 30 33 C30 48 68 47 68 66 C68 85 27 85 27 69"
        fill="none" stroke="url(#ms)" stroke-width="15.5" stroke-linecap="round" opacity="0.92"/>
