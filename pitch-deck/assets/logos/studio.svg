<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ms" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0%" stop-color="#c98e7a"/>
      <stop offset="26%" stop-color="#cba36b"/>
      <stop offset="50%" stop-color="#a7ae8e"/>
      <stop offset="74%" stop-color="#94a0b4"/>
      <stop offset="100%" stop-color="#b196a6"/>
    </linearGradient>
    <filter id="smush" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>
  <!-- smushed soft halo (non-vibrant blend) -->
  <path d="M71 29 C71 16 30 16 30 33 C30 48 68 47 68 66 C68 85 27 85 27 69"
